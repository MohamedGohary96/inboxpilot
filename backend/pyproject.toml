[project]
name = "todo-mail"
version = "0.1.0"
description = "Email-to-Todo Assistant — reads Gmail, surfaces actionable tasks using Claude"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.125",
    "google-genai>=1.0",
    "groq>=0.13",
    "apscheduler>=3.10,<4",
    "keyring>=25",
    "html2text>=2024.2",
    "typer[all]>=0.12",
    "rapidfuzz>=3.9",
    "tenacity>=8.2",
    "pync>=2.0.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
todo-mail = "todo_mail.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["todo_mail/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["todo_mail"]

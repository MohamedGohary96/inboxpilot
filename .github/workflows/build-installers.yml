name: Build Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases

env:
  APP_NAME: InboxPilot

jobs:
  # ── Mac build (arm64 — runs natively on Apple Silicon, via Rosetta on Intel) ─
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/todo_mail/dist
          cp -r dist ../backend/todo_mail/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -e backend/
          pip install pyinstaller

      - name: Build .app bundle
        run: pyinstaller installer/InboxPilot.spec --distpath installer/dist --workpath installer/build -y

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg
        run: |
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --volicon "installer/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 150 185 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 450 185 \
            "installer/dist/${{ env.APP_NAME }}-mac.dmg" \
            "installer/dist/${{ env.APP_NAME }}.app"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: installer/dist/${{ env.APP_NAME }}-mac.dmg

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue ..\backend\todo_mail\dist
          Copy-Item -Recurse dist ..\backend\todo_mail\dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -e backend/
          pip install pyinstaller

      - name: Build Windows .exe
        run: pyinstaller installer/InboxPilot.spec --distpath installer/dist --workpath installer/build -y

      - name: Rename output
        run: Move-Item installer/dist/${{ env.APP_NAME }}.exe installer/dist/${{ env.APP_NAME }}-windows.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/dist/${{ env.APP_NAME }}-windows.exe

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body: |
            ## ${{ env.APP_NAME }} ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon + Intel via Rosetta) | `${{ env.APP_NAME }}-mac.dmg` |
            | Windows 10/11 | `${{ env.APP_NAME }}-windows.exe` |

            ### Install
            - **Mac**: Open the `.dmg`, drag ${{ env.APP_NAME }} to Applications, double-click to launch.
            - **Windows**: Run the `.exe` directly — no installation needed.
          files: |
            artifacts/mac/${{ env.APP_NAME }}-mac.dmg
            artifacts/windows/${{ env.APP_NAME }}-windows.exe
          draft: false
          prerelease: false
